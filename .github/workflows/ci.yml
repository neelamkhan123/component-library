name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test
      - run: npm run build
      - run: npm run build-storybook
      - name: Serve Storybook and run a11y tests
        run: |
          npx http-server packages/ui/storybook-static --port 6006 --silent &
          npx wait-on tcp:6006
          npm run test-storybook
      # Deployment promotes this exact artifact rather than rebuilding, so
      # what reaches production is the build axe-core just passed over.
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      # The docs site imports the built package the same way a consumer does,
      # so the library has to be built before Next can resolve or scan it.
      - run: npm run build -w @neelamkhan21/ui
      - run: npm run typecheck -w docs
      # The deployed site lives under /preview in a shared bucket, so the
      # artifact has to be built for that path — basePath is baked in at build
      # time and cannot be applied at deploy time.
      - run: npm run build -w docs
        env:
          NEXT_PUBLIC_BASE_PATH: /preview
      - uses: actions/upload-artifact@v4
        with:
          name: docs-static
          path: apps/docs/out
          retention-days: 7

  deploy-storybook:
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # No checkout, no npm install, no rebuild — this job only moves bytes
      # that the test job already produced and verified.
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      # --exclude protects the destination prefix from --delete as well as
      # skipping it on upload; the docs live under preview/ in this bucket.
      - run: aws s3 sync storybook-static/ s3://${{ secrets.AWS_S3_BUCKET }} --delete --exclude "preview/*"
      - run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DIST_ID }} --paths "/*"

  # Serves the docs from the preview/ prefix of the bucket that already hosts
  # Storybook, so this needs no new bucket, distribution, certificate or DNS.
  #
  # The origin is S3 over REST, which resolves exact object keys only — it has
  # no directory-index behaviour and returns 403 for anything else. Next
  # exports pages as flat `.html` files but links to them without the
  # extension, so the files are uploaded under extension-stripped keys that
  # match those links exactly. Entry point is /preview (no trailing slash;
  # /preview/ would need a CloudFront function to rewrite).
  deploy-docs:
    needs: [docs, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-static
          path: docs-static
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Assets keep their extensions, so a plain sync gives them correct
      # content types. --delete also clears the previous deploy's page keys,
      # which the next step immediately rewrites.
      - name: Sync assets
        run: |
          aws s3 sync docs-static/ "s3://${{ secrets.AWS_S3_BUCKET }}/preview/" \
            --delete --exclude "*.html"

      # Pages, uploaded under extension-stripped keys. Content type has to be
      # set explicitly: without an extension the CLI would label them
      # binary/octet-stream and browsers would download rather than render.
      - name: Upload pages under extensionless keys
        working-directory: docs-static
        run: |
          find . -name "*.html" -print0 | while IFS= read -r -d "" file; do
            rel="${file#./}"
            stem="${rel%.html}"
            if [ "$stem" = "index" ]; then key="preview"; else key="preview/$stem"; fi
            aws s3 cp "$file" "s3://${{ secrets.AWS_S3_BUCKET }}/$key" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "public, max-age=0, must-revalidate" \
              --only-show-errors
          done
          echo "uploaded $(find . -name '*.html' | wc -l) pages"

      - name: Invalidate the docs path
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DIST_ID }} \
            --paths "/preview" "/preview/*"
