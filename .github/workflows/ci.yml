name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test
      - run: npm run build
      - run: npm run build-storybook
      - name: Serve Storybook and run a11y tests
        run: |
          npx http-server packages/ui/storybook-static --port 6006 --silent &
          npx wait-on tcp:6006
          npm run test-storybook
      # Deployment promotes this exact artifact rather than rebuilding, so
      # what reaches production is the build axe-core just passed over.
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      # The docs site imports the built package the same way a consumer does,
      # so the library has to be built before Next can resolve or scan it.
      - run: npm run build -w neelam-ui
      - run: npm run typecheck -w docs
      # No NEXT_PUBLIC_BASE_PATH: the docs are served from the root of
      # neelamui.com now, and next.config.mjs already defaults basePath to the
      # empty string, which is exactly what serving at a domain root wants.
      - run: npm run build -w docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-static
          path: apps/docs/out
          retention-days: 7

  # Serves storybook.neelamui.com from the storybook/ prefix of the bucket,
  # through a distribution whose origin path is /storybook. The two deploy
  # jobs now write to disjoint prefixes — this one confined to storybook/,
  # the docs one excluding it — so they no longer race and can run in
  # parallel again.
  deploy-storybook:
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # No checkout, no npm install, no rebuild — this job only moves bytes
      # that the test job already produced and verified.
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      # --delete is scoped to the storybook/ prefix by the destination, so it
      # can no longer reach a docs key no matter when this job runs.
      - run: aws s3 sync storybook-static/ "s3://${{ secrets.AWS_S3_BUCKET }}/storybook/" --delete
      - run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_STORYBOOK_DIST_ID }} --paths "/*"

  # Serves the docs from the root of the bucket, at neelamui.com.
  #
  # The origin is S3 over REST, which resolves exact object keys only — it has
  # no directory-index behaviour and returns 403 for anything else. Next
  # exports pages as flat `.html` files but links to them without the
  # extension, so the files are uploaded under extension-stripped keys that
  # match those links exactly. The home page is the one exception: it keeps
  # its `.html`, because `/` is resolved by the distribution's default root
  # object, which names a literal key.
  deploy-docs:
    needs: [docs, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-static
          path: docs-static
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Assets keep their extensions, so a plain sync gives them correct
      # content types. --delete also clears the previous deploy's page keys,
      # which the next step immediately rewrites.
      - name: Sync assets
        run: |
          aws s3 sync docs-static/ "s3://${{ secrets.AWS_S3_BUCKET }}/" \
            --delete --exclude "*.html" --exclude "storybook/*"

      # Pages, uploaded under extension-stripped keys — except the home page,
      # which stays index.html for the default root object to resolve. Content
      # type has to be set explicitly: without an extension the CLI would
      # label them binary/octet-stream and browsers would download rather
      # than render.
      - name: Upload pages under extensionless keys
        working-directory: docs-static
        run: |
          find . -name "*.html" -print0 | while IFS= read -r -d "" file; do
            rel="${file#./}"
            stem="${rel%.html}"
            if [ "$stem" = "index" ]; then key="index.html"; else key="$stem"; fi
            aws s3 cp "$file" "s3://${{ secrets.AWS_S3_BUCKET }}/$key" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "public, max-age=0, must-revalidate" \
              --only-show-errors
          done
          echo "uploaded $(find . -name '*.html' | wc -l) pages"

      - name: Invalidate the docs
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DIST_ID }} \
            --paths "/*"
